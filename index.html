<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חתונת שלוימי & חני</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --gold:#d4af37;
      --gold2:#f7e7a9;
      --text:#fffaf0;
      --muted:#d7d7d7;
      --card:rgba(255,255,255,.08);
      --border:rgba(247,231,169,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.20), transparent 35%),
        radial-gradient(circle at bottom left, rgba(247,231,169,.12), transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
    }
    .wrap{
      width:min(960px,100%);
      text-align:center;
      position:relative;
    }
    .sparkles{
      position:absolute;
      inset:-20px;
      pointer-events:none;
      opacity:.55;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(212,175,55,.9) 0 1px, transparent 1.5px);
      background-size:42px 42px, 67px 67px;
      background-position:0 0, 20px 15px;
      mask-image:linear-gradient(to bottom, black, transparent 85%);
    }
    .card{
      position:relative;
      border:1px solid var(--border);
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
      border-radius:32px;
      padding:48px 28px 36px;
      backdrop-filter: blur(12px);
      box-shadow:0 24px 70px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .card::before,
    .card::after{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border:1px solid rgba(212,175,55,.24);
      border-radius:50%;
    }
    .card::before{top:-90px;right:-70px}
    .card::after{bottom:-100px;left:-80px}
    .eyebrow{
      color:var(--gold2);
      letter-spacing:.08em;
      font-size:16px;
      margin-bottom:12px;
    }
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(42px,8vw,82px);
      font-weight:500;
      line-height:1;
    }
    h1 .amp{
      color:var(--gold);
      font-style:italic;
      padding:0 .12em;
    }
    .divider{
      margin:20px auto 18px;
      width:180px;
      height:1px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
      position:relative;
    }
    .divider::after{
      content:"✦";
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      color:var(--gold2);
      background:#172033;
      padding:0 10px;
    }
    .date{
      font-size:clamp(18px,3vw,24px);
      color:var(--gold2);
      margin-bottom:8px;
      font-weight:700;
    }
    .sub{
      color:var(--muted);
      font-size:15px;
    }
    .countdown{
      direction:rtl;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
      margin:34px auto 10px;
      max-width:780px;
    }
    .unit{
      min-width:0;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      padding:24px 10px 18px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }
    .num{
      direction:ltr;
      font-variant-numeric:tabular-nums;
      font-size:clamp(36px,6vw,64px);
      font-weight:800;
      line-height:1;
      color:white;
      text-shadow:0 0 24px rgba(212,175,55,.18);
    }
    .label{
      margin-top:10px;
      color:var(--gold2);
      font-size:15px;
      font-weight:700;
    }
    .blessing{
      margin-top:28px;
      color:var(--gold2);
      font-size:18px;
      letter-spacing:.03em;
    }
    .status{
      margin-top:12px;
      color:var(--muted);
      font-size:14px;
    }
    @media(max-width:620px){
      body{padding:14px}
      .card{padding:36px 14px 28px;border-radius:24px}
      .countdown{grid-template-columns:repeat(2,minmax(0,1fr));max-width:360px}
      .unit{padding:20px 8px 16px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="sparkles" aria-hidden="true"></div>
    <section class="card">
      <div class="eyebrow">בסימן טוב ובמזל טוב</div>
      <h1>שלוימי <span class="amp">&amp;</span> חני</h1>
      <div class="divider"></div>
      <div class="date">ד׳ שבט תשפ״ז · יום שלישי · 19:00</div>
      <div class="sub">12 בינואר 2027 · שעון ישראל</div>

      <div class="countdown" aria-live="polite">
        <div class="unit">
          <div class="num" id="seconds">--</div>
          <div class="label">שניות</div>
        </div>
        <div class="unit">
          <div class="num" id="minutes">--</div>
          <div class="label">דקות</div>
        </div>
        <div class="unit">
          <div class="num" id="hours">--</div>
          <div class="label">שעות</div>
        </div>
        <div class="unit">
          <div class="num" id="days">---</div>
          <div class="label">ימים</div>
        </div>
      </div>

      <div class="blessing">עוד מעט זה קורה ✦</div>
      <div class="status" id="status">סופרים לאחור לרגע הגדול</div>
    </section>
  </main>

  <script>
    const target = new Date('2027-01-12T19:00:00+02:00').getTime();
    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2,'0');

    function updateCountdown(){
      const diff = target - Date.now();

      if(diff <= 0){
        $('days').textContent = '0';
        $('hours').textContent = '00';
        $('minutes').textContent = '00';
        $('seconds').textContent = '00';
        $('status').textContent = 'מזל טוב! הגיע היום הגדול 🎉';
        return;
      }

      const total = Math.floor(diff / 1000);
      $('days').textContent = Math.floor(total / 86400);
      $('hours').textContent = pad(Math.floor((total % 86400) / 3600));
      $('minutes').textContent = pad(Math.floor((total % 3600) / 60));
      $('seconds').textContent = pad(total % 60);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
